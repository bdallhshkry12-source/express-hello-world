<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار مثير: مين الشخص اللي بيراقبك في السر؟ 👀</title>
    <meta property="og:title" content="اختبار مثير: مين الشخص اللي بيراقبك في السر؟ 👀"/>
    <meta property="og:description" content="أجب عن الأسئلة واكتشف من هو الشخص الذي يعشق مراقبتك سراً في الخفاء!"/>
    <meta property="og:type" content="article"/>
    <style>
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #fff;
            color: #333;
            width: 100%;
            max-width: 450px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }
        h2 {
            color: #e91e63;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 10px 0;
            width: 100%;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .option-btn {
            background: #f0f2f5;
            color: #333;
            border: 2px solid #ddd;
        }
        .option-btn:hover {
            background: #e4e6eb;
            border-color: #ff416c;
            color: #ff416c;
        }
        .hidden {
            display: none;
        }
        .result-card {
            background: #fff5f8;
            border: 2px dashed #ff416c;
            padding: 20px;
            border-radius: 15px;
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #c2185b;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- شاشة البداية -->
    <div id="welcome-screen">
        <h2>👁️ مين الشخص اللي بيراقبك في السر؟</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 20px;">اختبار سريع يكشف لك الشخص الخفي اللي معجب بيك وبيراقب كل خطواتك!</p>
        <button class="btn" onclick="startQuiz()">ابدأ الاختبار الآن 🚀</button>
    </div>

    <!-- الأسئلة -->
    <div id="quiz-screen" class="hidden">
        <h3 id="question-text" style="color: #333; margin-bottom: 20px;"></h3>
        <div id="options-container"></div>
    </div>

    <!-- شاشة النتيجة -->
    <div id="result-screen" class="hidden">
        <h2>🎉 النتيجة السرية لك:</h2>
        <div class="result-card" id="result-text"></div>
        <p style="margin-top: 20px; font-size: 14px; color: #555;">شارك النتيجة مع أصدقائك وتحدى الجميع!</p>
        <button class="btn" style="background: #1877f2;" onclick="shareOnFacebook()">مشاركة على فيسبوك 💙</button>
        <button class="btn" style="background: #25d366;" onclick="shareOnWhatsApp()">مشاركة على واتساب 💚</button>
        <button class="btn" style="background: #333;" onclick="restartQuiz()">🔄 إعادة الاختبار</button>
    </div>
</div>

<script>
    const questions = [
        {
            question: "لما بتكون قاعد لوحدك، بتفكر في مين أكتر؟",
            options: ["صديق قديم من أيام زمان", "شخص عرفته صدفة ومش قادر أنساه", "شخص غامض بيظهر وبيتختفي"]
        },
        {
            question: "إيه أكتر حاجة بتلفت انتباهك في طريقة تعامل الشخص معاك؟",
            options: ["نظرات عيونه المركزة عليك", "اهتمامه بأدق تفاصيلك اليومية", "طريقته الخاصة وهو بيبتسم لك لوحدك"]
        },
        {
            question: "اختار حرف عشوائي كده بيخطر على بالك فجأة:",
            options: ["حرف (م)", "حرف (أ)", "حرف (س / ر)"]
        }
    ];

    let currentQuestion = 0;

    const results = [
        "فالنتيجة: الشخص الذي يراقبك في السر هو شخص قريب منك جداً، يتابع كل ستوري تنزلها، ويحفظ تفاصيل كلامك ويتمنى لو يجرؤ على مصارحتك بمشاعره!",
        "فالنتيجة: هناك شخص من الماضي عاد لمراقبتك في الخفاء، يراقب نجاحاتك وتطورك بصمت وخوف شديد من الاقتراب.",
        "فالنتيجة: شخص غامض ومعجب سري، يراقبك من بعيد لبعيد ويراقب ردود أفعالك ويعتبرك مصدر إلهام يومي له!"
    ];

    function startQuiz() {
        document.getElementById('welcome-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        if (currentQuestion < questions.length) {
            document.getElementById('question-text').innerText = questions[currentQuestion].question;
            let optionsHtml = '';
            questions[currentQuestion].options.forEach((opt, index) => {
                optionsHtml += `<button class="btn option-btn" onclick="selectOption(${index})">${opt}</button>`;
            });
            document.getElementById('options-container').innerHTML = optionsHtml;
        } else {
            showResult();
        }
    }

    function selectOption(index) {
        currentQuestion++;
        showQuestion();
    }

    function showResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        let randomRes = results[Math.floor(Math.random() * results.length)];
        document.getElementById('result-text').innerText = randomRes;
    }

    function shareOnFacebook() {
        let url = encodeURIComponent(window.location.href);
        window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank');
    }

    function shareOnWhatsApp() {
        let url = encodeURIComponent(window.location.href);
        window.open(`https://api.whatsapp.com/send?text=اعرف مين الشخص اللي بيراقبك في السر من خلال الاختبار ده: ${url}`, '_blank');
    }

    function restartQuiz() {
        currentQuestion = 0;
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('welcome-screen').classList.remove('hidden');
    }
</script>

</body>
</html>
