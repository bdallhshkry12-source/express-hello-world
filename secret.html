<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مين الشخص اللي بيراقبك في السر؟</title>
    
    <meta property="og:title" content="مين الشخص اللي بيراقبك في السر؟">
    <meta property="og:description" content="اختبار سريع يكشف لك الشخص الخفي اللي معجب بيك وبيراقب كل خطواتك بصمت!">
    <meta property="og:image" content="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=600">
    <meta property="og:type" content="website">
    
    <style>
        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #fff;
            font-family: 'Cairo', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #quiz-box {
            background: #191724;
            color: #fff;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        button {
            transition: 0.2s;
            cursor: pointer;
        }
        button:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

<div id="quiz-box">
    <div id="welcome-screen">
        <h2 style="color: #ff416c; margin-bottom: 15px;">مين الشخص اللي بيراقبك في السر؟</h2>
        <p style="font-size: 14px; margin-bottom: 20px; color: #ddd;">اختبار سريع يكشف لك الشخص الخفي اللي معجب بيك وبيراقب كل خطواتك</p>
        <button onclick="startQuiz()" style="background: linear-gradient(45deg, #ff416c, #ff4b2b); color: white; border: none; padding: 12px 25px; border-radius: 10px; font-size: 16px; font-weight: bold; width: 100%;">ابدأ الاختبار الآن 🚀</button>
    </div>

    <div id="quiz-screen" style="display: none;">
        <h3 id="question-text" style="color: #fff; margin-bottom: 20px; font-size: 18px;"></h3>
        <div id="options-container"></div>
    </div>

    <div id="result-screen" style="display: none;">
        <h2 style="color: #ff416c; margin-bottom: 10px;">النتيجة السرية لك</h2>
        <div id="result-text" style="background: #26233a; border: 2px dashed #ff416c; padding: 15px; border-radius: 10px; color: #ffb86c; font-size: 15px; font-weight: bold; margin-bottom: 15px; line-height: 1.6;"></div>
        
        <p style="font-size: 13px; color: #ddd; margin-bottom: 15px;">شارك النتيجة مع أصدقائك وتحدى الجميع</p>
        
        <div style="margin-bottom: 15px;">
            <button onclick="shareOnFacebook()" style="background: #1877f2; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; width: 100%; margin-bottom: 8px;">مشاركة فيسبوك 💙</button>
            <button onclick="shareOnWhatsApp()" style="background: #25d366; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; width: 100%;">مشاركة واتساب 💚</button>
        </div>

        <button onclick="restartQuiz()" style="background: #333; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; width: 100%;">🔄 إعادة الاختبار</button>
    </div>
</div>

<script>
    const questions = [
        {
            question: "لما بتكون قاعد لوحدك بتفكر في مين أكتر؟",
            options: ["صديق قديم من أيام زمان", "شخص عرفته صدفة ومش قادر أنساه", "شخص غامض بيظهر وبيتختفي"]
        },
        {
            question: "إيه أكتر حاجة بتلفت انتباهك في طريقة تعامل الشخص معاك؟",
            options: ["نظرات عيونه المركزة عليك", "اهتمامه بأدق تفاصيلك اليومية", "طريقته الخاصة وهو بيبتسم لك لوحدك"]
        },
        {
            question: "اختار حرف عشوائي كده بيخطر على بالك فجأة:",
            options: ["حرف م", "حرف أ", "حرف س أو ر"]
        }
    ];

    let currentQuestion = 0;
    let finalResultText = "";

    const results = [
        "الشخص الذي يراقبك في السر هو شخص قريب منك جدا يتابع كل ستوري تنزلها ويحفظ تفاصيل كلامك ويتمنى لو يجرؤ على مصارحتك بمشاعره!",
        "هناك شخص من الماضي عاد لمراقبتك في الخفاء يراقب نجاحاتك وتطورك بصمت وخوف شديد من الاقتراب.",
        "شخص غامض ومعجب سري يراقبك من بعيد لبعيد ويراقب ردود أفعالك ويعتبرك مصدر إلهام يومي له!"
    ];

    function startQuiz() {
        document.getElementById('welcome-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        if (currentQuestion < questions.length) {
            document.getElementById('question-text').innerText = questions[currentQuestion].question;
            let optionsHtml = '';
            questions[currentQuestion].options.forEach((opt, index) => {
                optionsHtml += `<button onclick="selectOption(${index})" style="background: #2a283e; color: #fff; border: 1px solid #444; padding: 12px 15px; margin: 8px 0; width: 100%; border-radius: 8px; font-size: 15px; font-weight: bold; text-align: center; display: block;">${opt}</button>`;
            });
            document.getElementById('options-container').innerHTML = optionsHtml;
        } else {
            showResult();
        }
    }

    function selectOption(index) {
        currentQuestion++;
        showQuestion();
    }

    function showResult() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        finalResultText = results[Math.floor(Math.random() * results.length)];
        document.getElementById('result-text').innerText = finalResultText;
    }

    function shareOnFacebook() {
        let url = encodeURIComponent(window.location.href);
        window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank');
    }

    function shareOnWhatsApp() {
        let shareText = "نتيجة اختباري: " + finalResultText + "\n\nجرب الاختبار أنت كمان من هنا: " + window.location.href;
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`, '_blank');
    }

    function restartQuiz() {
        currentQuestion = 0;
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('welcome-screen').style.display = 'block';
    }
</script>

</body>
    </html>
