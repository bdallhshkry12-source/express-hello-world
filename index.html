<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>من يشبهك من المشاهير بصورة بروفايلك</title>
    <style>
        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #fff;
            font-family: 'Cairo', Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        #quiz-box {
            background: #191724;
            color: #fff;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .fb-login-btn {
            background: #1877f2;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: bold;
            width: 100%;
            margin-top: 15px;
            border: none;
            font-size: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        button {
            transition: 0.2s;
            cursor: pointer;
        }
        button:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

<div id="quiz-box">
    <!-- شاشة البداية -->
    <div id="welcome-screen">
        <h2 style="color: #ff416c; margin-bottom: 10px;">شبيهك من المشاهير 🎭</h2>
        <p style="font-size: 14px; color: #ddd; margin-bottom: 20px;">جاوب على سؤالين واعرف النجم اللي بيشبهك بربط حسابك فيسبوك!</p>
        <button onclick="startQuiz()" style="background: linear-gradient(45deg, #ff416c, #ff4b2b); color: white; border: none; padding: 12px 25px; border-radius: 10px; font-size: 16px; font-weight: bold; width: 100%;">ابدأ الاختبار الآن 🚀</button>
    </div>

    <!-- شاشة الأسئلة -->
    <div id="quiz-screen" style="display: none;">
        <h3 id="question-text" style="color: #fff; margin-bottom: 20px; font-size: 17px;"></h3>
        <div id="options-container"></div>
    </div>

    <!-- شاشة طلب ربط الفيسبوك بعد انتهاء الأسئلة -->
    <div id="fb-step-screen" style="display: none;">
        <h3 style="color: #25d366; margin-bottom: 10px;">أتممت الاختبار بنجاح!</h3>
        <p style="font-size: 13px; color: #ddd; margin-bottom: 20px;">الخطوة الأخيرة: اربط حسابك فيسبوك لاستخراج كارت الشبيّه المخصص لك.</p>
        <button class="fb-login-btn" onclick="simulateFacebookLogin()">
            <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            متابعة باستخدام فيسبوك
        </button>
    </div>

    <!-- شاشة التحميل الوهمية -->
    <div id="loading-screen" style="display: none; padding: 30px 0;">
        <h3 style="color: #ffb86c; font-size: 16px;">جاري الاتصال بحساب فيسبوك...</h3>
        <p style="font-size: 13px; color: #aaa;">جاري جلب صورة البروفايل والاسم الشخصي...</p>
    </div>

    <!-- شاشة النتيجة -->
    <div id="result-screen" style="display: none;">
        <h2 style="color: #ff416c; margin-bottom: 10px;">نتيجة اختبار الشبه</h2>
        
        <div style="margin-bottom: 15px;">
            <canvas id="resultCanvas" width="350" height="250" style="width: 100%; border-radius: 10px; border: 2px solid #ff416c; background: #161421;"></canvas>
        </div>
        
        <button onclick="shareOnWhatsApp()" style="background: #25d366; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; width: 100%; margin-bottom: 8px;">مشاركة النتيجة واتساب 💚</button>
        <button onclick="restartQuiz()" style="background: #333; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; width: 100%;">🔄 إعادة الاختبار</button>
    </div>
</div>

<script>
    const questions = [
        {
            question: "ما هي صفتك الغالبة في التعامل مع الآخرين؟",
            options: ["هادئ ورومانسي", "اجتماعي ومرح", "غامض وقوي الحضور"]
        },
        {
            question: "في أوقات فراغك، ما هو تفضيلك الأول؟",
            options: ["مشاهدة الأفلام والمسلسلات", "السفر واستكشاف أماكن جديدة", "الجلوس بمفردي للتفكير"]
        }
    ];

    let currentQuestion = 0;
    const celebrities = [
        { name: "ليوناردو دي كابريو", match: "94%" },
        { name: "كريستيانو رونالدو", match: "97%" },
        { name: "أنجلينا جولي", match: "91%" },
        { name: "دوا جونسون (النجم الصخرة)", match: "95%" }
    ];

    let finalCelebrity = "";
    let userDisplayName = "صديقنا الغالي";

    function startQuiz() {
        document.getElementById('welcome-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        if (currentQuestion < questions.length) {
            document.getElementById('question-text').innerText = questions[currentQuestion].question;
            let optionsHtml = '';
            questions[currentQuestion].options.forEach((opt, index) => {
                optionsHtml += `<button onclick="selectOption()" style="background: #2a283e; color: #fff; border: 1px solid #444; padding: 12px 15px; margin: 8px 0; width: 100%; border-radius: 8px; font-size: 15px; font-weight: bold; text-align: center; display: block;">${opt}</button>`;
            });
            document.getElementById('options-container').innerHTML = optionsHtml;
        } else {
            // خلصنا الأسئلة، نعرض زرار ربط الفيسبوك
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('fb-step-screen').style.display = 'block';
        }
    }

    function selectOption() {
        currentQuestion++;
        showQuestion();
    }

    function simulateFacebookLogin() {
        document.getElementById('fb-step-screen').style.display = 'none';
        document.getElementById('loading-screen').style.display = 'block';

        setTimeout(() => {
            const fbProfileImgUrl = "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200"; 
            userDisplayName = "محمد أحمد"; // اسم تجريبي يظهر على الكارت
            
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = function() {
                showResultScreen(img, userDisplayName);
            };
            img.src = fbProfileImgUrl;
        }, 2000);
    }

    function showResultScreen(userImg, name) {
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        finalCelebrity = celebrities[Math.floor(Math.random() * celebrities.length)];
        drawCanvas(userImg, finalCelebrity, name);
    }

    function drawCanvas(userImg, celeb, name) {
        const canvas = document.getElementById('resultCanvas');
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#191724';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#ff416c';
        ctx.lineWidth = 2;
        ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

        ctx.save();
        ctx.beginPath();
        ctx.arc(80, 95, 42, 0, Math.PI * 2, true);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(userImg, 38, 53, 84, 84);
        ctx.restore();

        ctx.strokeStyle = '#1877f2';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(80, 95, 42, 0, Math.PI * 2, true);
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 13px Tahoma, sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText('البروفايل: ' + name, canvas.width - 35, 55);

        ctx.fillStyle = '#ccc';
        ctx.font = '12px Tahoma, sans-serif';
        ctx.fillText('توأم روحك الفني هو:', canvas.width - 35, 80);

        ctx.fillStyle = '#ffb86c';
        ctx.font = 'bold 15px Tahoma, sans-serif';
        ctx.fillText(celeb.name, canvas.width - 35, 105);

        ctx.fillStyle = '#25d366';
        ctx.font = 'bold 13px Tahoma, sans-serif';
        ctx.fillText('نسبة الشبه: ' + celeb.match, canvas.width - 35, 132);

        ctx.fillStyle = '#aaa';
        ctx.font = '11px Tahoma, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('اختبر صورتك الشخصية أنت كمان!', canvas.width / 2, 195);
    }

    function shareOnWhatsApp() {
        let shareText = "جاوبت على الاختبار وطلع شبيهي النجم " + finalCelebrity.name + " بنسبة " + finalCelebrity.match + "! جرب اختبارك من هنا: " + window.location.href;
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`, '_blank');
    }

    function restartQuiz() {
        currentQuestion = 0;
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('welcome-screen').style.display = 'block';
    }
</script>

</body>
  </html>
